name: Update Live Train Status

on:
  schedule:
    - cron: '*/5 * * * *'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: live-status-update
  cancel-in-progress: true

jobs:
  fetch-live:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          sparse-checkout: scripts

      - name: Fetch and publish live Viaggiatreno status (2x loop for fresher updates)
        run: |
          publish_once() {
            python3 scripts/fetch_live.py /tmp/live.json
            rm -rf /tmp/live-branch
            mkdir -p /tmp/live-branch
            cp /tmp/live.json /tmp/live-branch/live.json
            cd /tmp/live-branch
            git init -b live-data
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add live.json
            git commit -m "Live train status update"
            git remote add origin "https://x-access-token:${GITHUB_TOKEN}@github.com/${GITHUB_REPOSITORY}.git"
            git push --force origin live-data
            cd "${GITHUB_WORKSPACE}"
          }

          publish_once
          if [ "${GITHUB_EVENT_NAME}" = "schedule" ]; then
            sleep 120
            publish_once
          fi
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
