name: Update Live Train Status

on:
  schedule:
    # Off-minute 15-min schedule during Italian rail service hours (04:00-23:59 UTC = 05:00-01:00 Italy)
    # Avoids :00/:05/:15/:30 peak load spikes where GitHub drops */5 crons.
    - cron: '7,22,37,52 4-23 * * *'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: live-status-update
  cancel-in-progress: true

jobs:
  fetch-live:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout scripts
        uses: actions/checkout@v4
        with:
          sparse-checkout: scripts

      - name: Fetch and publish live Viaggiatreno status
        run: |
          publish_once() {
            python3 scripts/fetch_live.py /tmp/live.json
            rm -rf /tmp/live-branch
            mkdir -p /tmp/live-branch
            cp /tmp/live.json /tmp/live-branch/live.json
            cd /tmp/live-branch
            git init -b live-data
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add live.json
            git commit -q -m "Live train status update"
            git remote add origin "https://x-access-token:${GITHUB_TOKEN}@github.com/${GITHUB_REPOSITORY}.git"
            git push -q --force origin live-data
            cd "${GITHUB_WORKSPACE}"
          }

          publish_once

          # On scheduled runs, keep refreshing every 2 minutes across the 15-min window
          if [ "${GITHUB_EVENT_NAME}" = "schedule" ]; then
            for i in 1 2 3 4 5 6; do
              sleep 120
              publish_once
            done
          fi
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
